<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat with Beacon</title>
  <meta name="theme-color" content="#9B1C1C">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <script defer src="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/chat-messenger.js"></script>
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-default.css">
  <link rel="stylesheet" href="https://www.gstatic.com/chat-messenger/sdk/prod/v1.16/themes/chat-messenger-layout.css">

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #FFFFFF;
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* The chat fills the whole screen, on phones and laptops. */
    chat-messenger {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;
      z-index: 1 !important;
      --chat-messenger-color--primary: #9B1C1C;
      --chat-messenger-color--link: #9B1C1C;
      --chat-messenger-font-family: "IBM Plex Sans", system-ui, sans-serif;
      --chat-messenger-shape--corner-value-extra-large: 0px;
      --chat-messenger-elevation: none;
    }

    chat-messenger-container {
      position: relative !important;
      inset: auto !important;
      transform: none !important;
      width: 100% !important;
      max-width: none !important;
      height: 100% !important;
      max-height: none !important;
    }
  </style>
</head>
<body>
  <script>
    window.addEventListener("chat-messenger-loaded", () => {
      chatSdk.registerContext(
        chatSdk.prebuilts.ces.createContext({
          deploymentName: "projects/669612121545/locations/us/apps/9a35a1df-01e9-4752-b38d-7a401333e48b/deployments/b29f5179-7041-4766-b551-178a540df430",
          tokenBroker: {
            enableTokenBroker: true,
            enableRecaptcha: false
          }
        }),
      );
    });
  
    // Open links from the chat in a new tab, so the conversation is not lost.
    document.addEventListener("click", (event) => {
      const link = event.composedPath().find((el) => el.tagName === "A" && el.href);
      if (!link) {
        return;
      }
      const url = new URL(link.href, window.location.href);
      const isWebLink = url.protocol === "http:" || url.protocol === "https:";
      if (isWebLink && url.origin !== window.location.origin) {
        event.preventDefault();
        window.open(url.href, "_blank", "noopener");
      }
    }, true);
  </script>

  <chat-messenger url-allowlist="*" color-scheme="light">
    <chat-messenger-container chat-title="Beacon" chat-title-icon="https://gstatic.com/dialogflow-console/common/assets/ccai-favicons/conversational_agents.png">
      <chat-reset-session-button slot="titlebar-actions" title-text="Start new chat"></chat-reset-session-button>
    </chat-messenger-container>
  </chat-messenger>
</body>
</html>
